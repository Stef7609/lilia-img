name: fetch-audio
on: push
permissions:
  contents: write
jobs:
  get:
    if: contains(github.event.head_commit.message, '[fetch-audio]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -o media/voix-lilia.mp3 "$(cat media/voix-url.txt)"
          rm media/voix-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media && git commit -m "voix Lilia" && git push
